spring.application.name=padobackend
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

# PostgreSQL is the database selected by the existing project. Credentials stay in env vars.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pado}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT_SECRET is mandatory and must be at least 32 characters for HS256.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Server-side geocoding proxy. The public Nominatim endpoint requires a recognizable User-Agent,
# centralized caching and no more than one provider request per second.
app.geocoding.base-url=${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
app.geocoding.user-agent=${GEOCODING_USER_AGENT:PADO-MVP/1.0}
app.geocoding.minimum-interval-ms=${GEOCODING_MINIMUM_INTERVAL_MS:1100}

# Optional safe admin bootstrap. No public admin registration endpoint exists.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# MVP sample data is opt-in and should only be enabled for local/demo environments.
app.seed.enabled=${SEED_DATA_ENABLED:false}
app.seed.password=${SEED_DATA_PASSWORD:DemoPassword123!}

# MVP only: disable this in non-demo environments and replace it with a payment-provider webhook.
app.payment.mock-enabled=${PAYMENT_MOCK_ENABLED:true}
app.payment.vietqr.bank-id=${VIETQR_BANK_ID:}
app.payment.vietqr.bank-name=${VIETQR_BANK_NAME:}
app.payment.vietqr.account-number=${VIETQR_ACCOUNT_NUMBER:}
app.payment.vietqr.account-name=${VIETQR_ACCOUNT_NAME:}
app.payment.vietqr.template=${VIETQR_TEMPLATE:compact2}

# Registration OTP. Use EMAIL_PROVIDER=resend with a server-side RESEND_API_KEY to deliver real email.
# Local/test mode logs the OTP on the backend and never exposes a provider secret to the browser.
app.auth.otp.expiration-minutes=${AUTH_OTP_EXPIRATION_MINUTES:5}
app.auth.otp.resend-cooldown-seconds=${AUTH_OTP_RESEND_COOLDOWN_SECONDS:60}
app.auth.otp.max-attempts=${AUTH_OTP_MAX_ATTEMPTS:5}
app.auth.otp.fixed-code=${AUTH_OTP_FIXED_CODE:}
app.auth.otp.expose-code=${AUTH_OTP_EXPOSE_CODE:false}
app.email.provider=${EMAIL_PROVIDER:log}
app.email.from=${EMAIL_FROM:PADO <onboarding@resend.dev>}
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.resend.url=${RESEND_API_URL:https://api.resend.com/emails}

# Authenticated server-side Cloudinary uploads. API secret must never be exposed to the frontend.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=${CLOUDINARY_FOLDER:pado/products}
app.cloudinary.max-files=${CLOUDINARY_MAX_FILES:8}
app.cloudinary.max-file-bytes=${CLOUDINARY_MAX_FILE_BYTES:8388608}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=64MB

server.error.include-message=never
server.error.include-stacktrace=never
