services:
  - type: web
    name: pado-backend
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: -XX:InitialRAMPercentage=20.0 -XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres.hfwmxrrfxsmfhewffemc
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: DB_POOL_MAX_SIZE
        value: "5"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "30000"
      - key: DB_POOL_MAX_LIFETIME_MS
        value: "600000"
      - key: DB_POOL_KEEPALIVE_MS
        value: "120000"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MINUTES
        value: "60"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEOCODING_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: GEOCODING_USER_AGENT
        value: PADO-MVP/1.0
      - key: GEOCODING_MINIMUM_INTERVAL_MS
        value: "1100"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DATA_ENABLED
        value: "true"
      - key: SEED_DATA_PASSWORD
        sync: false
      - key: PAYMENT_MOCK_ENABLED
        value: "false"
      - key: VIETQR_BANK_ID
        value: "970436"
      - key: VIETQR_BANK_NAME
        value: Vietcombank
      - key: VIETQR_ACCOUNT_NUMBER
        sync: false
      - key: VIETQR_ACCOUNT_NAME
        sync: false
      - key: VIETQR_TEMPLATE
        value: compact2
      - key: EMAIL_PROVIDER
        value: log
      - key: AUTH_OTP_EXPOSE_CODE
        value: "true"
      - key: AUTH_OTP_EXPIRATION_MINUTES
        value: "5"
      - key: AUTH_OTP_RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: AUTH_OTP_MAX_ATTEMPTS
        value: "5"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: pado/products
      - key: CLOUDINARY_MAX_FILES
        value: "8"
      - key: CLOUDINARY_MAX_FILE_BYTES
        value: "8388608"
